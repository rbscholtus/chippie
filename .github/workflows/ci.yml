name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ebitengine's native build on Linux needs these headers (cgo: GLFW, OpenGL, ALSA).
env:
  EBITEN_DEPS: libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev

jobs:
  lint:
    name: Lint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: native
            goos: ""
            goarch: ""
          - target: wasm
            goos: js
            goarch: wasm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Ebitengine dependencies
        if: matrix.target == 'native'
        run: sudo apt-get update && sudo apt-get install -y $EBITEN_DEPS
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Ebitengine dependencies
        run: sudo apt-get update && sudo apt-get install -y $EBITEN_DEPS xvfb
      - name: Test (race)
        run: xvfb-run -a go test -race -coverprofile=coverage.out ./...
      - name: Upload golden-frame failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: testdata/failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Short fuzz run
        run: go test ./chip8 -run=NONE -fuzz=FuzzRunFrame -fuzztime=30s

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Ebitengine dependencies
        run: sudo apt-get update && sudo apt-get install -y $EBITEN_DEPS
      - name: Native
        run: go build ./...
      - name: WebAssembly
        run: GOOS=js GOARCH=wasm go build ./...
      - name: Keep net/http out of the WebAssembly build
        # It adds ~1.7 MB gzip; the browser uses platform.Fetch (fetch()).
        run: |
          if GOOS=js GOARCH=wasm go list -deps ./cmd/chippie | grep -qx net/http; then
            echo "::error::net/http is linked into chippie.wasm; use platform.Fetch"
            exit 1
          fi
      - name: Browser build
        run: ./scripts/build.sh
      - name: Download size budget (README §16)
        run: |
          size=$(wc -c < web/dist/chippie-gz.wasm)
          echo "chippie-gz.wasm: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((6 * 1024 * 1024)) ]; then
            echo "::error::chippie-gz.wasm is $((size / 1024)) KB, over the 6 MB budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # the file-picker test loads a test-suite ROM
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
