name: Refresh catalogue

# Weekly: refresh the chip-8-database snapshot and sources.json from the
# latest commits of each repository, and delete the overlay entries upstream
# now has. The run page shows a before/after summary; a PR with the same
# summary is opened if the snapshot changed.
#
# The PR is opened with the REFRESH_TOKEN secret (a fine-grained token with
# Contents and Pull requests read/write on this repository), so CI runs on
# it: GitHub runs no workflows for a PR opened with github.token, which is
# the fallback while the secret isn't set.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.REFRESH_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }} # for the API's rate limit; read-only use
        run: go run ./cmd/catalogue-gen -update-pins -summary "$RUNNER_TEMP/summary.md"
      - name: Check the snapshot still loads
        run: go test ./internal/catalogue/
      - name: Report, and open a PR if the snapshot changed
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN || github.token }}
        run: |
          summary="$RUNNER_TEMP/summary.md"
          # Only the snapshot and the overlay count: a coverage.md change on
          # its own (e.g. a wording change in the generator) is not worth a PR.
          if [ -z "$(git status --porcelain -- assets/catalogue/snapshot assets/catalogue/overlay.json)" ]; then
            printf '\nNo changes to the snapshot or the overlay, so no PR.\n' >> "$summary"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="catalogue-refresh-$(date -u +%Y%m%d)"
          printf '\nGenerated by `cmd/catalogue-gen -update-pins`. Details in docs/coverage.md.\n' >> "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add assets/catalogue/snapshot assets/catalogue/overlay.json docs/coverage.md
          git commit -m "chore(catalogue): refresh snapshot and sources"
          git push -u origin "$branch"
          gh pr create --title "chore(catalogue): refresh snapshot and sources" --body-file "$summary"
