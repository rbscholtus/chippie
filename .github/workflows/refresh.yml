name: Refresh catalogue

# Weekly: refresh the chip-8-database snapshot and sources.json from the
# latest commits of each repository. The run page shows a before/after
# summary; a PR with the same summary is opened if the snapshot changed.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Regenerate
        run: go run ./cmd/catalogue-gen -update-pins -summary "$RUNNER_TEMP/summary.md"
      - name: Check the snapshot still loads
        run: go test ./catalogue/
      - name: Report, and open a PR if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$RUNNER_TEMP/summary.md"
          # Only the snapshot counts: a coverage.md change on its own (e.g. a
          # wording change in the generator) is not worth a PR.
          if [ -z "$(git status --porcelain -- catalogue/snapshot)" ]; then
            printf '\nNo changes to the snapshot, so no PR.\n' >> "$summary"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="catalogue-refresh-$(date -u +%Y%m%d)"
          printf '\nGenerated by `cmd/catalogue-gen -update-pins`. Details in docs/coverage.md.\n' >> "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalogue/snapshot docs/coverage.md
          git commit -m "chore(catalogue): refresh snapshot and sources"
          git push -u origin "$branch"
          gh pr create --title "chore(catalogue): refresh snapshot and sources" --body-file "$summary"
